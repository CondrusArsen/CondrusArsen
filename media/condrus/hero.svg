<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Arseni Atrokhov — Roblox Developer &amp; Game Prototyper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f33"/><stop offset=".55" stop-color="#1d1546"/><stop offset="1" stop-color="#0a0816"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1"><stop offset="0" stop-color="#6d4bff" stop-opacity=".75"/><stop offset="1" stop-color="#6d4bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1"><stop offset="0" stop-color="#f5a742" stop-opacity=".45"/><stop offset="1" stop-color="#f5a742" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#f5c542"/><stop offset="1" stop-color="#c98a12"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <clipPath id="frame"><rect width="1280" height="330" rx="18"/></clipPath>
    <style>
      .t { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .in { opacity: 0; animation: in .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s } .d4 { animation-delay: .75s }
      @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .dot { animation: pulse 2.2s ease-in-out infinite; transform-origin: 845px 266px; }
      @keyframes pulse { 50% { opacity: .35; } }
      .roles text { opacity: 0; animation: role 12s infinite; }
      .roles text:nth-child(2) { animation-delay: 3s } .roles text:nth-child(3) { animation-delay: 6s } .roles text:nth-child(4) { animation-delay: 9s }
      @keyframes role { 0% { opacity: 0; transform: translateY(8px); } 4%, 22% { opacity: 1; transform: none; } 26%, 100% { opacity: 0; transform: translateY(-8px); } }
      .caret { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="330" fill="url(#bg)"/>
    <ellipse cx="220" cy="300" rx="420" ry="260" fill="url(#glowA)"><animate attributeName="cx" values="220;300;220" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1120" cy="20" rx="380" ry="220" fill="url(#glowB)"><animate attributeName="cy" values="20;60;20" dur="11s" repeatCount="indefinite"/></ellipse>
    <rect width="1280" height="330" fill="url(#grid)"/>
    <text x="1250" y="250" text-anchor="end" class="t" font-size="190" font-weight="800" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1.5" letter-spacing="-6">CONDRUS</text>
    <!-- строка меню CondrusOS -->
    <rect width="1280" height="34" fill="#0a0818" fill-opacity=".6"/>
    <rect x="14" y="7" width="20" height="20" rx="6" fill="url(#gold)"/><text x="24" y="22" text-anchor="middle" class="t" font-size="12" font-weight="800" fill="#3b2900">C</text>
    <text x="44" y="22" class="t" font-size="13" font-weight="700" fill="#f4f2ff">CondrusOS</text>
    <text x="128" y="22" class="t" font-size="13" fill="#b3aed0">Arseni Atrokhov · Roblox Developer · Game Prototyper</text>
    <circle cx="1094" cy="17" r="4" fill="#4ade80"/><text x="1104" y="22" class="t" font-size="13" fill="#c9f5d6">Open to remote work</text>
    <!-- логотип -->
    <g class="in d1"><rect x="70" y="92" width="128" height="128" rx="34" fill="url(#gold)"/><rect x="70" y="210" width="128" height="10" rx="5" fill="#b07a0e" opacity=".55"/>
      <text x="134" y="182" text-anchor="middle" class="t" font-size="80" font-weight="800" fill="#3b2900">C</text></g>
    <text x="236" y="146" class="t in d2" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Arseni Atrokhov</text>
    <text x="238" y="190" class="t in d3" font-size="28" font-weight="700" fill="#f5c542">Roblox Developer &amp; Game Prototyper</text>
    <g class="roles t" font-size="20" fill="#d8d4ee">
      <text x="238" y="232">Luau · client/server systems · DataStore · Rojo</text>
      <text x="238" y="232">3 Roblox games · 100+ playable prototypes</text>
      <text x="238" y="232">Building games with AI agents — Claude Code &amp; Codex</text>
      <text x="238" y="232">600+ game teardowns · loops, FTUE, economy</text>
    </g>
    <g class="in d4">
      <rect x="236" y="250" width="270" height="40" rx="20" fill="#f5c542"/><text x="371" y="276" text-anchor="middle" class="t" font-size="16" font-weight="800" fill="#2a1f00">▶ Open my computer</text>
      <rect x="518" y="250" width="300" height="40" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="668" y="276" text-anchor="middle" class="t" font-size="15" font-weight="600" fill="#f4f2ff">Gomel, Belarus · UTC+3 · Remote</text>
      <circle class="dot" cx="845" cy="270" r="6" fill="#4ade80"/><text x="860" y="276" class="t" font-size="15" font-weight="600" fill="#c9f5d6">Available for full-time roles</text>
    </g>
  </g>
</svg>
